[project]
name = "pyacddb"
version = "0.0.1"
description = ""
readme = "README.md"
requires-python = "==3.12.*"
license = "MIT"
authors = [{ name = "jannisborn", email = "jannis.born@gmx.de" }]

dependencies = [
  "marimo>=0.2.13,<1.0.0",
  "pandas>=2.2.1,<3.0.0",
  "numpy>=1.20.4,<2.0.0",
  "loguru>=0.7.2,<1.0.0",
  "tqdm>=4.66.4,<5.0.0",
  "python-telegram-bot==13.7",
  "requests>=2.32.3,<3.0.0",
  "pillow>=10.4.0,<11.0.0",
  "together>=1.2.7,<2.0.0",
  "urllib3<2"
]

[dependency-groups]
dev = [
  "isort>=5.13.2,<6.0.0",
  "pre-commit>=3.7.1,<4.0.0",
  "pytest>=8.2.2,<9.0.0",
  "ruff>=0.8.0,<1.0.0",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyacddb*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.isort]
profile = "black"
line_length = 88
